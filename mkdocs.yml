site_name: Nyrqis
site_description: Documentation for the Nyrqis operating system project
repo_url: https://github.com/Myco-mycelium/Nythera
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy

nav:
  - Home: index.md
  - Platform:
      - Manifest: 00-platform/000-THE_NYRQIS_MANIFEST.md
      - Constitution: 00-platform/001-PROJECT_CONSTITUTION.md
      - AI Collaboration Protocol: 00-platform/002-AI_COLLABORATION_PROTOCOL.md
