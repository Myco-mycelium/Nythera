# Cross-architecture conformance: validate the seccomp syscall tables
# and policy compilation on aarch64 via QEMU user-mode emulation.
#
# This job does NOT run the full test suite on arm64 (that would require
# an arm64 runner or full system emulation). Instead it:
# 1. Cross-compiles the Rust crates for aarch64-unknown-linux-gnu
# 2. Runs the cross-architecture conformance tests + the aarch64
#    policy-building tests via QEMU (qemu-aarch64-static + the
#    aarch64 sysroot) to validate the syscall table on the target arch.
# 3. The tests verify: baseline entries resolve, capability-gated
#    entries resolve, policy compiles, no x86-only leakage, functional
#    category coverage, and deny-wins invariant.

name: arm64-conformance

on:
  push:
    branches: [main]
    paths:
      - 'source/nyhal-linux-backend/backend/seccomp.py'
      - 'source/nyhal-linux-backend/test_backend.py'
      - 'source/nyhal-linux-backend/rust/**'
  pull_request:
    branches: [main]
    paths:
      - 'source/nyhal-linux-backend/backend/seccomp.py'
      - 'source/nyhal-linux-backend/test_backend.py'
      - 'source/nyhal-linux-backend/rust/**'
  workflow_dispatch:

jobs:
  arm64-seccomp-cross-arch:
    name: aarch64 seccomp table conformance (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for aarch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aarch64 Python via apt
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3:arm64 qemu-user-static libc6-dev:arm64

      - name: Cross-compile Rust crates for aarch64
        run: |
          # Add the aarch64 target
          rustup target add aarch64-unknown-linux-gnu
          # Cross-compile each crate
          for crate in seccomp syscalls nyfs ipc transport container ipcd keys nyui; do
            echo "--- Building rust/$crate for aarch64 ---"
            cd source/nyhal-linux-backend/rust/$crate
            cargo build --release --target aarch64-unknown-linux-gnu 2>&1 || echo "WARN: $crate may not have aarch64 target, skipping"
            cd -
          done

      - name: Run aarch64 conformance tests via QEMU
        working-directory: source/nyhal-linux-backend
        run: |
          # Run the cross-architecture conformance tests + aarch64 policy tests
          # These tests validate the aarch64 syscall table and policy compilation
          # without needing a real arm64 kernel (they use the simulator, not real seccomp)
          qemu-aarch64-static /usr/bin/python3 -B -m unittest \
            test_backend.TestCrossArchitectureConformance \
            test_backend.TestSeccompEnforcement.test_aarch64_policy_builds \
            test_backend.TestDefaultDenyAllowlist.test_aarch64_allowlist_builds \
            test_backend.TestDefaultDenyAllowlist.test_policy_json_roundtrip \
            test_backend.TestDefaultDenyAllowlist.test_syscall_tables_have_unique_numbers \
            test_backend.TestDefaultDenyAllowlist.test_always_deny_names_excluded_from_baseline \
            test_backend.TestDefaultDenyAllowlist.test_baseline_names_resolve_on_x86_64 \
            2>&1
