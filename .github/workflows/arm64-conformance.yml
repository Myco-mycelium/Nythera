# Cross-architecture conformance: validate the seccomp syscall tables
# and policy compilation on aarch64 via cross-compilation.
#
# This job does NOT run the full test suite on arm64 (that would require
# an arm64 runner or full system emulation). Instead it:
# 1. Cross-compiles the Rust crates for aarch64-unknown-linux-gnu
# 2. Runs the cross-architecture conformance tests on x86_64 (they
#    validate the aarch64 syscall table against x86_64 without needing
#    a real arm64 kernel)
# 3. The tests verify: baseline entries resolve, capability-gated
#    entries resolve, policy compiles, no x86-only leakage, functional
#    category coverage, and deny-wins invariant.

name: arm64-conformance

on:
  push:
    branches: [main]
    paths:
      - 'source/nyhal-linux-backend/backend/seccomp.py'
      - 'source/nyhal-linux-backend/test_backend.py'
      - 'source/nyhal-linux-backend/rust/**'
  pull_request:
    branches: [main]
    paths:
      - 'source/nyhal-linux-backend/backend/seccomp.py'
      - 'source/nyhal-linux-backend/test_backend.py'
      - 'source/nyhal-linux-backend/rust/**'
  workflow_dispatch:

jobs:
  arm64-cross-compile:
    name: aarch64 Rust crate cross-compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cross-compile Rust crates for aarch64
        run: |
          for crate in seccomp syscalls nyfs ipc transport container ipcd keys nyui wayland; do
            echo "--- Building rust/$crate for aarch64 ---"
            cd source/nyhal-linux-backend/rust/$crate
            cargo build --release --target aarch64-unknown-linux-gnu 2>&1 | tail -3
            cd -
          done

      - name: Verify aarch64 cdylib artifacts
        run: |
          for crate in seccomp syscalls nyfs ipc transport container ipcd keys nyui wayland; do
            lib=$(ls source/nyhal-linux-backend/rust/$crate/target/aarch64-unknown-linux-gnu/release/lib*.so 2>/dev/null | head -1)
            if [ -n "$lib" ]; then
              echo "✅ $crate: $(basename $lib)"
            else
              echo "⚠️  $crate: no aarch64 artifact found"
            fi
          done

  arm64-table-conformance:
    name: aarch64 seccomp table conformance (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run cross-architecture conformance tests
        working-directory: source/nyhal-linux-backend
        run: |
          # These tests validate the aarch64 syscall table against x86_64
          # without needing a real arm64 kernel or QEMU
          python3 -B -m unittest \
            test_backend.TestCrossArchitectureConformance \
            2>&1
