name: live-iso-arm64

# Builds the arm64 Nyrqis live-demo ISO (build-live-iso.sh --arch arm64)
# and boot-smokes it exactly like the amd64 one: a direct-kernel boot
# (tests/boot_smoke.py --arch arm64) and the human menu path through the
# image's own GRUB (tests/boot_smoke_menu.py --arch arm64, UEFI via
# qemu-efi-aarch64). The virt machine's serial console is ttyAMA0; both
# smokes drive the demo session over it.
#
# The rootfs is cross-built with a foreign debootstrap
# (qemu-user-static + binfmt emulation); no arm64 runner is required.

on:
  workflow_dispatch:
    # Same input as live-iso.yml's: the re-attach job's release tag.
    inputs:
      release-tag:
        description: Tag whose release receives the ISO (must match v*)
        type: string
        required: false
  schedule:
    # Weekly, offset from the amd64 build so the two do not contend.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "packaging/live/**"
      - ".github/workflows/live-iso-arm64.yml"
      - "tests/boot_smoke.py"
      - "tests/boot_smoke_menu.py"
      - "scripts/attach_release_asset.sh"  # the release logic itself
    tags:
      - "v*"                    # release tags: menu-boot-arm64's release step is gated on refs/tags/v*, so WITHOUT this trigger the arm64 ISO could never reach a release (the amd64 workflow had exactly this block; found when v0.29.25 shipped with amd64 runs only)

permissions:
  contents: write   # release upload needs contents:write on tag builds

jobs:
  build-arm64:
    name: Build arm64 live demo ISO
    runs-on: ubuntu-latest
    # Worst case: cache-miss emulated debootstrap (step cap 90) + apt (5)
    # + smoke (29) + checkout/cache/upload overhead. Ceiling
    # sanity-checked by TestJobTimeoutContract (<= 150).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-build toolchain
        # grub-efi-arm64-bin exists ONLY in arm64-built archives (Debian
        # main/binary-arm64, Ubuntu [ports]) — apt on this amd64 runner
        # cannot locate it (the first CI round proved exactly that).
        # The package is all data (grub modules), so extracting the .deb
        # into /usr/lib/grub/arm64-efi is enough: grub-mkrescue
        # (grub-common, amd64) builds the UEFI image from those modules
        # at ISO assembly time — verified locally: the produced
        # efi.img carries EFI/BOOT/bootaa64.efi and the xorriso plan
        # has NO i386-pc eltorito path (pure UEFI, as arm64 requires).
        # The deb URL is resolved from the Packages index so it cannot
        # rot with version churn.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support \
            squashfs-tools xorriso mtools dosfstools e2fsprogs \
            grub-common grub2-common
          DEB_PATH=$(curl -fsSL \
            https://deb.debian.org/debian/dists/bookworm/main/binary-arm64/Packages.xz \
            | xz -dc | awk '/^Package: grub-efi-arm64-bin$/{f=1} \
                            f && /^Filename: /{print $2; exit}')
          test -n "$DEB_PATH" || { echo "grub-efi-arm64-bin not found in the index"; exit 1; }
          curl -fsSL -o /tmp/grub-arm64-bin.deb "https://deb.debian.org/debian/$DEB_PATH"
          dpkg-deb -x /tmp/grub-arm64-bin.deb /tmp/grub-arm64-root
          test -d /tmp/grub-arm64-root/usr/lib/grub/arm64-efi \
            || { echo "arm64-efi modules not in the .deb — layout changed"; exit 1; }
          sudo cp -a /tmp/grub-arm64-root/usr/lib/grub/arm64-efi /usr/lib/grub/
          ls /usr/lib/grub/arm64-efi/monolithic/grubaa64.efi >/dev/null \
            && echo "arm64-efi module tree staged ($(ls /usr/lib/grub/arm64-efi/*.mod | wc -l) modules)"

      - name: Restore the cached rootfs (if a previous round built one)
        # Cross-built arm64 rootfs (foreign debootstrap + emulated
        # second stage) is the workflow's slowest step by far — cache
        # it exactly like the amd64 workflow does. The key carries the
        # include list so a package-set change invalidates.
        uses: actions/cache@v4
        with:
          path: /tmp/nyrqis-rootfs-cache
          key: nyrqis-rootfs-arm64-bookworm-v1-systemd-sysv-sudo-linux-image-arm64-live-boot-python3-zstandard-cffi-ply-nacl-lz4-fuse3

      - name: Assemble the arm64 rootfs (foreign debootstrap, emulated, or restore from cache)
        run: |
          if sudo test -d /tmp/nyrqis-rootfs-cache/rootfs; then
            echo "rootfs cache HIT — reusing the cached arm64 rootfs"
            sudo mv /tmp/nyrqis-rootfs-cache/rootfs /srv/nyrqis-rootfs-arm64
          else
            echo "rootfs cache MISS — running foreign debootstrap"
            sudo debootstrap --variant=minbase --arch=arm64 --foreign \
              --include=systemd,systemd-sysv,sudo,linux-image-arm64,live-boot,live-boot-initramfs-tools,python3,python3-zstandard,python3-cffi,python3-ply,python3-nacl,python3-lz4,fuse3 \
              bookworm /srv/nyrqis-rootfs-arm64 http://deb.debian.org/debian
            # Same include list as build-live-iso.sh (python3-cffi /
            # python3-ply are the REAL packages behind VIRTUAL deps
            # debootstrap cannot resolve — without them second stage dies
            # configuring python3-zstandard).
            # Stage the emulator INSIDE the rootfs: binfmt_misc resolves
            # the interpreter path within the chroot. build-live-iso.sh
            # does the same for its own chroot steps; the second stage
            # and apt both need it present.
            sudo cp /usr/bin/qemu-aarch64-static /srv/nyrqis-rootfs-arm64/usr/bin/
            sudo chroot /srv/nyrqis-rootfs-arm64 /debootstrap/debootstrap --second-stage
          fi
          # The qemu-aarch64-static staged inside MUST survive from the
          # cached rootfs too — build-live-iso.sh's chroot steps need it
          # (a cached rootfs already carries it; a fresh one has it from
          # the miss branch above). Belt-and-braces re-stage:
          sudo test -x /srv/nyrqis-rootfs-arm64/usr/bin/qemu-aarch64-static \
            || sudo cp /usr/bin/qemu-aarch64-static /srv/nyrqis-rootfs-arm64/usr/bin/
          sudo chroot /srv/nyrqis-rootfs-arm64 apt-get update
          # Runs on BOTH paths: the cache could predate a builder-side
          # top-up change. (build-live-iso.sh also ensures these itself
          # since 0.29.13 — belt-and-braces for the cross-built rootfs.)
          sudo chroot /srv/nyrqis-rootfs-arm64 apt-get install -y --no-install-recommends \
            python3 python3-zstandard python3-nacl python3-lz4 fuse3 bash
          sudo chroot /srv/nyrqis-rootfs-arm64 apt-get clean

      - name: Build the arm64 ISO
        run: |
          sudo packaging/live/build-live-iso.sh \
            --arch arm64 \
            --rootfs /srv/nyrqis-rootfs-arm64 \
            -o dist/nyrqis-live-arm64.iso
          # Stage the rootfs for the post-build cache save (the action
          # saves only when its key missed).
          sudo mkdir -p /tmp/nyrqis-rootfs-cache
          sudo rm -rf /tmp/nyrqis-rootfs-cache/rootfs
          sudo cp -a /srv/nyrqis-rootfs-arm64 /tmp/nyrqis-rootfs-cache/rootfs
        timeout-minutes: 90

      - name: Smoke-check the ISO structure
        run: |
          test -f dist/nyrqis-live-arm64.iso
          xorriso -indev dist/nyrqis-live-arm64.iso -find /live -name 'vmlinuz' | grep -q vmlinuz
          xorriso -indev dist/nyrqis-live-arm64.iso -find /boot/grub -name 'grub.cfg' | grep -q grub.cfg
          du -h dist/nyrqis-live-arm64.iso

      # The QEMU toolchain installs in its OWN step: apt time must not
      # eat the smoke step's budget (round after round of arm64 CI died
      # on exactly this arithmetic).
      - name: Install the QEMU toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-efi-aarch64
        timeout-minutes: 5

      - name: Direct boot smoke (arm64 kernel, ttyAMA0 handshake)
        run: |
          python3 tests/boot_smoke.py dist/nyrqis-live-arm64.iso \
            --arch arm64 --timeout 1680 --keep-logs
        # Measured envelope: a full arm64 boot smoke under TCG took
        # ~11.5 min on a fast host (banner at ~2 min, markers at
        # ~11.5 min); GitHub's shared runners emulate aarch64 several
        # times slower, and the previous 15-min budget killed QEMU
        # mid-handshake on every round since 2026-09-14 — on an image
        # that provably boots. 28 min is ~2.5x the fast-host envelope
        # and still fails fast on a real hang.
        timeout-minutes: 29

      - name: Upload direct-boot serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-boot-smoke-serial-log
          path: /tmp/nyrqis-boot-smoke-*/serial.log
          if-no-files-found: ignore

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyrqis-live-iso-arm64
          path: dist/nyrqis-live-arm64.iso
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  menu-boot-arm64:
    # The HUMAN boot path on arm64: UEFI firmware chain-loads the ISO's
    # grubaa64, the menu times out, the default entry boots — same
    # contract as the amd64 menu-boot job, on the other architecture.
    # SPLIT from the direct smoke into its own job: a bootloader
    # regression then fails THIS job while the direct-smoke job (and
    # the builder gates) still show green — the failure is diagnosable
    # as "menu path" without reading logs, and a direct-smoke failure
    # can no longer mask a menu-path one (or vice versa).
    name: Menu-path boot smoke (GRUB via UEFI)
    runs-on: ubuntu-latest
    needs: build-arm64
    # checkout + download + apt (5) + smoke (29) + attach (20 cap) +
    # upload. Contract ceiling: 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the built ISO
        uses: actions/download-artifact@v4
        with:
          name: nyrqis-live-iso-arm64
          path: dist

      - name: Install the QEMU toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-efi-aarch64
        timeout-minutes: 5

      - name: Boot the ISO like a machine (GRUB menu → default entry, UEFI)
        run: |
          python3 tests/boot_smoke_menu.py dist/nyrqis-live-arm64.iso \
            --arch arm64 --timeout 1680 --keep-logs
        # Same TCG-envelope arithmetic as the direct smoke above.
        timeout-minutes: 29

      - name: Upload menu-boot serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-menu-boot-smoke-serial-log
          path: /tmp/nyrqis-boot-smoke-menu-*/serial.log
          if-no-files-found: ignore

      - name: Attach the ISO to the release (tag builds only)
        # Both architectures ship with a v* release: the amd64 upload
        # lives in live-iso.yml's menu-boot job; this is the arm64 half.
        # The logic (race-safe create, bounded-curl upload, draft
        # self-heal) lives in ONE shared script also used by the
        # re-attach job below and race-tested by test_release_race.sh
        # against fake_gh.sh — do not inline it back here.
        if: startsWith(github.ref, 'refs/tags/v')
        # Same as the amd64 attach step: a hang must die as this named
        # step, not as a job-budget cancellation with no evidence
        # (v0.29.25 burned two rounds on exactly that).
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_PATH: dist/nyrqis-live-arm64.iso
        run: scripts/attach_release_asset.sh

  re-attach:
    # Manual recovery path (workflow_dispatch): uploads.github.com has
    # had sustained 5xx windows — v0.29.25's beat the in-step retries
    # (500/500/hang + 500/500/502) — so this job re-attaches the
    # ALREADY-BUILT arm64 ISO from this run's artifact; no rebuild.
    # Dispatch on main with release-tag set.
    name: Re-attach ISO to the release
    runs-on: ubuntu-latest
    needs: [build-arm64, menu-boot-arm64]
    if: >-
      always() &&
      needs.build-arm64.result == 'success' &&
      needs.menu-boot-arm64.result != 'cancelled' &&
      startsWith(inputs.release-tag, 'v')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the built ISO
        uses: actions/download-artifact@v4
        with:
          name: nyrqis-live-iso-arm64
          path: dist

      - name: Attach the ISO to the release
        # Same 20-min named-step budget as the tag-push attach: a hang
        # must be visible and bounded, never a job-budget cancellation.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_PATH: dist/nyrqis-live-arm64.iso
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: scripts/attach_release_asset.sh
