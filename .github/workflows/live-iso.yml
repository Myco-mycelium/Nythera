name: live-iso

# Builds the Nyrqis live-demo ISO (packaging/live/README.md) and uploads
# it as a run artifact — the "click and open the live demo" deliverable,
# no local build required.

on:
  push:
    branches: [main]
    paths:
      - "packaging/live/**"
      - "source/nyhal-linux-backend/**"
      - ".github/workflows/live-iso.yml"
      - "tests/boot_smoke.py"        # the smoke's driver: its changes re-exercise the boot
      - "tests/boot_smoke_menu.py"   # the menu-path smoke: same deal
    tags:
      - "v*"                    # release tags: the ISO ships WITH the release
  workflow_dispatch:
  schedule:
    # Weekly refresh so the shipped image tracks main.
    - cron: "0 3 * * 1"

permissions:
  contents: write   # release upload needs contents:write on tag builds

jobs:
  build:
    name: Build live demo ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install ISO toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools genisoimage xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools isolinux \
            qemu-utils

      - name: Restore the cached rootfs (if a previous round built one)
        # The debootstrap rootfs is a pure function of the include list
        # + Debian suite — cache it so a routine ISO rebuild (docs,
        # demo, smoke-driver changes) skips the ~15-20 min bootstrap.
        # The cache key carries the include list so a package-set change
        # invalidates automatically. actions/cache refreshes the entry
        # only on key miss, so an unchanged list reuses the oldest copy;
        # the tar age is irrelevant (minbase + apt-get clean is inert).
        uses: actions/cache@v4
        with:
          path: /tmp/nyrqis-rootfs-cache
          key: nyrqis-rootfs-amd64-bookworm-v1-systemd-sysv-sudo-linux-image-amd64-live-boot-python3-zstandard-cffi-ply-nacl-lz4-fuse3

      - name: Assemble the rootfs (debootstrap, or restore from cache)
        run: |
          if sudo test -d /tmp/nyrqis-rootfs-cache/rootfs; then
            echo "rootfs cache HIT — reusing the cached rootfs"
            sudo mv /tmp/nyrqis-rootfs-cache/rootfs /srv/nyrqis-rootfs
          else
            echo "rootfs cache MISS — running debootstrap"
            sudo debootstrap --variant=minbase \
              --include=systemd,systemd-sysv,sudo,linux-image-amd64,live-boot,live-boot-initramfs-tools,python3,python3-zstandard,python3-cffi,python3-ply,python3-nacl,python3-lz4,fuse3 \
              bookworm /srv/nyrqis-rootfs http://deb.debian.org/debian
            # Same include list as build-live-iso.sh's own debootstrap path:
            # python3-cffi / python3-ply are the REAL packages behind the
            # VIRTUAL deps python3-zstandard / python3-pycparser declare;
            # debootstrap cannot resolve virtual deps and would leave
            # zstandard unconfigured (verified build failure).
          fi
          # Python + the demo probe's module checks live in the rootfs.
          # Runs on BOTH paths: the cache could predate a builder-side
          # top-up change, and apt is a cheap no-op when satisfied.
          # (build-live-iso.sh also ensures these itself since 0.29.13 —
          # this step is belt-and-braces for the prebuilt-rootfs path.)
          sudo chroot /srv/nyrqis-rootfs apt-get update
          sudo chroot /srv/nyrqis-rootfs apt-get install -y --no-install-recommends \
            python3 python3-zstandard python3-nacl python3-lz4 fuse3 bash
          sudo chroot /srv/nyrqis-rootfs apt-get clean
          # /dev/kvm, /dev/dri etc. are NOT probed at build time — the
          # banner probes the booting machine, not the builder.

      - name: Build the ISO
        run: |
          sudo packaging/live/build-live-iso.sh \
            --rootfs /srv/nyrqis-rootfs \
            -o dist/nyrqis-live.iso
          # Stage the rootfs for the post-build cache save (the action
          # saves only when its key missed; a hit skips this silently).
          sudo mkdir -p /tmp/nyrqis-rootfs-cache
          sudo rm -rf /tmp/nyrqis-rootfs-cache/rootfs
          sudo cp -a /srv/nyrqis-rootfs /tmp/nyrqis-rootfs-cache/rootfs
        timeout-minutes: 60

      - name: Smoke-check the ISO structure
        run: |
          test -f dist/nyrqis-live.iso
          # xorriso is installed: verify the hybrid layout + payload.
          xorriso -indev dist/nyrqis-live.iso -find /live -name 'vmlinuz' | grep -q vmlinuz
          xorriso -indev dist/nyrqis-live.iso -find /boot/grub -name 'grub.cfg' | grep -q grub.cfg
          xorriso -indev dist/nyrqis-live.iso -report_el_torito as_mkisofs | grep -qi efi \
            || echo "WARNING: no EFI boot entry found (BIOS-only build?)"
          du -h dist/nyrqis-live.iso

      - name: Boot smoke (headless QEMU, serial handshake)
        # Boots the ISO with the demo session on the serial console and
        # asserts the daemon answers ping (tests/boot_smoke.py). TCG on
        # the 2-core runner boots full userspace 5-15x slower than KVM:
        # 780 s budget + multi-user.target on the kernel cmdline, and
        # the step failure always carries the serial-log tail inline.
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          python3 tests/boot_smoke.py dist/nyrqis-live.iso \
            --timeout 780 --keep-logs
        timeout-minutes: 15

      - name: Upload boot-smoke serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke-serial-log
          path: /tmp/nyrqis-boot-smoke-*/serial.log
          if-no-files-found: ignore

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyrqis-live-iso
          path: dist/nyrqis-live.iso
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  menu-boot:
    # The HUMAN boot path: boots the built ISO with NO hand-built
    # kernel cmdline — the el torito BIOS image runs, the GRUB menu
    # times out, and its DEFAULT entry boots — then asserts the demo
    # session banner and the daemon on the serial line. The direct-boot
    # smoke above is deliberately immune to bootloader problems; this
    # job is not: a broken menu, default entry, or console wiring fails
    # here instead of on a user's machine (all menu entries carry
    # console=tty0 console=ttyS0,115200 so the human path is
    # serial-observable).
    name: Menu-path boot smoke (GRUB default entry)
    runs-on: ubuntu-latest
    needs: build
    # checkout + download + smoke (15) + attach (20 cap) + upload.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the built ISO
        uses: actions/download-artifact@v4
        with:
          name: nyrqis-live-iso
          path: dist

      - name: Boot the ISO like a machine (GRUB menu → default entry)
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          python3 tests/boot_smoke_menu.py dist/nyrqis-live.iso \
            --timeout 780 --keep-logs
        timeout-minutes: 15

      - name: Upload menu-boot serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-boot-smoke-serial-log
          path: /tmp/nyrqis-boot-smoke-menu-*/serial.log
          if-no-files-found: ignore

      - name: Attach the ISO to the release (tag builds only)
        # Every v* tag ships its own boot-smoked image as a permanent
        # release asset — no manual artifact download/re-upload step.
        if: startsWith(github.ref, 'refs/tags/v')
        # A hang here must die as THIS step (its name visible in the
        # job list), not be killed by the job budget with no evidence:
        # the v0.29.25 round's gh release upload stalled 28.5 min and
        # was cancelled by the job timeout, twice.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release page may not exist yet for a fresh tag — create
          # it before uploading. RACE-SAFE: on a tag push, this job and
          # menu-boot-arm64 run concurrently and BOTH may see no
          # release; the loser's create fails with "already_exists" —
          # tolerate that (the winner created it) and re-check before
          # giving up, so both ISOs always upload. --notes instead of
          # --generate-notes: server-side notes generation is another
          # stall point, and the notes are deterministic anyway.
          if ! gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "Nyrqis ${GITHUB_REF_NAME}" \
                 --notes "Boot-smoked live ISOs for ${GITHUB_REF_NAME} (amd64 + arm64). Both architectures passed the direct and menu-path QEMU boot smokes." \
              || { sleep 10; \
                   gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
                     || { echo "::error::release ${GITHUB_REF_NAME} could not be created or found"; exit 1; }; }
          fi
          # RETRY: the ~250 MB asset upload has stalled indefinitely
          # (v0.29.25, both arches). Bounded retries turn a stall into
          # a wait-and-succeed.
          up_ok=0
          for attempt in 1 2 3; do
            if gh release upload "${GITHUB_REF_NAME}" dist/nyrqis-live.iso \
                 --repo "$GITHUB_REPOSITORY" --clobber; then
              up_ok=1; break
            fi
            echo "upload attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          [ "$up_ok" = 1 ] || { echo "::error::asset upload failed after 3 attempts"; exit 1; }
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name'

      - name: Upload rootfs cache artifact
        # Superseded by the actions/cache rootfs above — the artifact
        # kept a 7-day tar nobody consumed. The cache action is the
        # durable store now.
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: nyrqis-live-rootfs
          path: dist/nyrqis-rootfs.tar
          compression-level: 6
          retention-days: 7
          if-no-files-found: ignore
