      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_compositor.so

  compositor-host:
    name: Compositor socket host half (required gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the compositor crate
        working-directory: source/nyhal-linux-backend/rust/compositor
        run: cargo build --release
      - name: End-to-end socket handshake through the wire event loop
        working-directory: source/nyhal-linux-backend
        run: python3 -B -m unittest tests.test_compositor_host

  wayland-real-clients:
    name: Real Wayland clients (weston-simple-shm + weston-terminal)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the compositor crate
        working-directory: source/nyhal-linux-backend/rust/compositor
        run: cargo build --release
      # The upstream binaries: weston-simple-shm (the canonical first
      # client any compositor must survive) and weston-terminal (the
      # GTK-class client — wl_seat devices, cursor pool, a real VTE
      # drawing loop). fonts-dejavu-core gives VTE a font to render.
      - name: Install weston (weston-simple-shm + weston-terminal)
        run: |
          sudo apt-get update
          sudo apt-get install -y weston fonts-dejavu-core
      - name: Real clients drive the full stack, zero protocol errors
        working-directory: source/nyhal-linux-backend
        run: |
          set +e
          python3 -B -m unittest \
            tests.test_wayland_client_compat \
            tests.test_weston_simple_shm \
            tests.test_weston_terminal \
            tests.test_weston -v > wayland-unittest.log 2>&1; S=$?
          set -e
          if [[ $S -ne 0 ]]; then
            . /etc/os-release
            echo "::error::Waylandgate env: $PRETTY_NAME / $(weston --version 2>&1 | head -1)"
            # flatten to one blob first: fold never merges lines, so the
            # naive form would emit 100s of annotations and lose all but
            # 10 to GitHub's per-step annotation cap
            tail -c 8000 wayland-unittest.log \
              | tr -d '\r' \
              | tr '\n' '|' \
              | fold -w 1000 \
              | awk '{printf "::error::Waylandgate[%d] %s\n", NR, $0}'
          fi
          exit $S

  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: source/nyhal-linux-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # zstandard is a real dependency of the NyFS compression tests
      # (ADR-0007): without it NyFSBlock.compress() stores data
      # uncompressed (the documented fallback) and the >30% ratio
      # guarantee cannot hold.
      - run: pip install pynacl zstandard
      # -u: stream output live (a hung test is then visible in the
      # log); the suite itself additionally dumps all thread stacks via
      # faulthandler after 60 minutes and exits.
      - run: python3 -u -B test_backend.py

  generators:
    name: Code generator validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: Nyrqis
      - uses: actions/checkout@v4
        with:
          repository: Myco-mycelium/Nyforge
          path: Nyforge
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow pysdl2 pysdl2-dll pynacl
      - name: Validate all generators + compositor
        run: python3 tools/validate_generators.py --verbose
        working-directory: Nyrqis

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow pysdl2 pysdl2-dll pynacl numpy watchdog pyyaml zstandard lz4
      - name: Run benchmarks
        run: python3 tests/benchmarks_all.py --repeat 3
      - name: Run benchmarks (JSON)
        run: python3 tests/benchmarks_all.py --repeat 3 --json > /tmp/benchmarks.json
      - name: Benchmark rot gates (ADR-0009/0007/0013)
        run: python3 source/nyhal-linux-backend/tools/benchmark_gate.py
      - name: ADR-0009 full benchmark record (artifact context)
        run: python3 tests/benchmark_bucket.py --fair-sweep || true
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: /tmp/benchmarks.json
          retention-days: 30
      - name: Compare with previous run
        if: always()
        run: |
          # Download previous benchmark artifact
          PREV_ID=$(gh run list --workflow=ci.yml --limit=2 --json databaseId --jq '.[1].databaseId' 2>/dev/null || echo '')
          if [ -n "$PREV_ID" ]; then
            gh run download $PREV_ID -n benchmarks -D /tmp/prev 2>/dev/null && \
            python3 tools/compare_benchmarks.py --current /tmp/benchmarks.json --baseline /tmp/prev/benchmarks.json || echo 'No previous baseline found'
          else
            echo 'No previous run found, skipping comparison'
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kernel-boot:
    name: Kernel boot gates (GRUB/BIOS + native UEFI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nykernel-package/source/nykernel
    steps:
      - uses: actions/checkout@v4
      # build-std (compiled from source, see the kernel's
      # .cargo/config.toml) needs the rust-src component; rust-lld comes
      # inside the toolchain sysroot and build.sh' PATH fallback finds it.
      # Pinned, not @stable: the kernel's Toolchain notes pin the exact
      # rustc/x86_64-crate pairing, and that pairing is load-bearing in
      # BOTH directions because the crate's core::iter::Step impls
      # track rustc's UNSTABLE trait shape, which has now changed three
      # times (0.14.10/rustc 1.75, 0.14.13/rustc 1.97, 0.15.5/rustc
      # 1.99): a floating @stable E0046'd the gates the morning stable
      # hit 1.99.1 against 0.14.13, and 0.15.5 E0407's under everything
      # before 1.99. The rust-version = "1.99.1" floor in the kernel's
      # Cargo.toml is the in-repo half of this contract; raising the
      # pin = the documented 1.75->1.97->1.99-style migration walk.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rust-src
      - name: Install the boot-emulation toolchain
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 mtools grub-pc-bin xorriso ovmf
      - name: Provide the OVMF firmware the scripts expect
        # uefi/tools/ is UNTRACKED by policy (external x86-64 firmware
        # binaries, see nykernel-package/.gitignore), so its directory
        # may not exist in a fresh checkout and its two .fd files (code
        # + variable store) must come from the distro's ovmf package.
        # The script names these exact files; every boot transcript in
        # nykernel IMPLEMENTATION_STATUS.md records this same path.
        run: |
          mkdir -p uefi/tools
          cp /usr/share/OVMF/OVMF_CODE_4M.fd uefi/tools/
          cp /usr/share/OVMF/OVMF_VARS_4M.fd uefi/tools/
      - name: BIOS gate (GRUB/Multiboot2 reach BootPhase::Ready, exit 33)
        run: |
          mkdir -p target   # fresh checkout has no target/ (gitignored); a redirect into a missing dir would fail the gate before it ever ran
          set +e
          ./tools/qemu_boot_test.sh > target/bios-gate.log 2>&1; S=$?
          set -e
          if [[ $S -ne 0 ]]; then
            . /etc/os-release
            echo "::error::BIOSgate env: $PRETTY_NAME / $(qemu-system-x86_64 --version 2>&1 | head -1) / $(grub-mkrescue --version 2>&1 | head -1) / rustc $(rustc -vV | sed -n 's/^release: //p')"
            ./tools/ci_emit_annotations.sh target/bios-gate.log BIOSgate
          fi
          exit $S
      - name: UEFI gate (OVMF boots the stub natively, same exit contract)
        run: |
          mkdir -p target
          set +e
          ./tools/qemu_uefi_boot_test.sh > target/uefi-gate.log 2>&1; S=$?
          set -e
          if [[ $S -ne 0 ]]; then
            . /etc/os-release
            echo "::error::UEFIgate env: $PRETTY_NAME / $(qemu-system-x86_64 --version 2>&1 | head -1) / rustc $(rustc -vV | sed -n 's/^release: //p')"
            ./tools/ci_emit_annotations.sh target/uefi-gate.log UEFIgate
          fi
          exit $S
      - name: Transcript parity (BIOS and UEFI demo chains line-identical)
        run: |
          mkdir -p target
          set +e
          ./tools/qemu_boot_parity_diff.sh > target/parity-gate.log 2>&1; S=$?
          set -e
          if [[ $S -ne 0 ]]; then
            . /etc/os-release
            echo "::error::Paritygate env: $PRETTY_NAME / rustc $(rustc -vV | sed -n 's/^release: //p')"
            ./tools/ci_emit_annotations.sh target/parity-gate.log Paritygate
          fi
          exit $S

