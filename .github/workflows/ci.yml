# Continuous integration: Python backend + the ADR-0020 Rust crates.
#
# - `rust-seccomp`: builds and tests the first-migration crate
#   (source/nyhal-linux-backend/rust/seccomp) on every push; the dev host
#   has no Rust toolchain, so this job IS the compiler.
# - `rust-seccomp-conformance`: the seccomp port's definition of
#   "shipped": it forces the seccomp-facing test classes through the
#   Rust seccomp module via the FFI loader (NYRQIS_RUST_FORCE=1). It
#   runs only those classes, not the full suite — forcing one module's
#   lib would make the OTHER modules' loaders (syscalls, NyFS codec)
#   fail their own force checks on the classes that depend on them. The
#   port landed 2026-08-13 and the gate is GREEN, so it is a required,
#   blocking job.
# - `rust-syscalls`: builds and tests the second-migration crate
#   (sethostname/prctl/unshare/mount — the direct-syscall launcher
#   primitives, implementation_plan.md §4.1).
# - `rust-syscalls-conformance`: the syscalls port's gate. It runs the
#   syscalls-facing test classes with NYRQIS_RUST_FORCE=1 and the crate
#   built, so every syscall call in those tests drives the Rust module.
#   (It runs only those classes, not the full suite: forcing the syscalls
#   lib would make the SEPARATE seccomp loader fail its own force check.
#   TestDirectSyscallLaunch/TestLauncherSecurity moved to the container
#   gate: they exercise the container launch-plan codec, so they must run
#   where THAT crate is built.)
# - `rust-nyfs`: builds and tests the third-migration crate
#   (SHA-256 checksum + Zstandard — the NyFS storage hot paths,
#   ADR-0020 priority #3).
# - `rust-nyfs-conformance`: the NyFS codec port's gate — the
#   differential test (Rust ≡ pure-Python floor on checksums,
#   roundtrips, and integrity failures) runs with the crate built and
#   NYRQIS_RUST_FORCE=1.
# - `rust-ipc`: builds and tests the fourth-migration crate (the IPC
#   message wire codec — binary framing, ADR-0020 priority #4).
# - `rust-ipc-conformance`: the IPC codec port's gate — the differential
#   test (Rust ≡ pure-Python floor, byte-identical wire) runs with the
#   crate built and NYRQIS_RUST_FORCE=1.
# - `rust-transport`: builds and tests the sixth-migration crate (the
#   IPC Unix-domain datagram transport hot path — sendto/recvmsg with
#   SCM_CREDENTIALS, ADR-0020 priority #6, the NPS-003 §6.1 close path).
# - `rust-transport-conformance`: the IPC transport port's gate — the
#   transport test classes (loader + differential: the FFI-driven
#   endpoint reproduces the Python floor's contract — payload, kernel
#   creds, sender path, timeout) run with the crate built and
#   NYRQIS_RUST_FORCE=1. It runs only raw-wire classes: forcing the
#   transport lib must not make the separate ipc-codec loader fail its
#   own force check.
# - `rust-container`: builds and tests the fifth-migration crate (the
#   container launch-plan primitives — launcher argv, cgroup v1/v2 plan,
#   root maps, and the NPS-010 §4 state machine, ADR-0020 priority #5).
# - `rust-container-conformance`: the container launch-plan port's gate —
#   the differential test (Rust ≡ pure-Python floor, byte-identical wires
#   across the config corpus) plus the container-facing behavior classes
#   (TestContainerPrimitives / TestLauncherSecurity /
#   TestDirectSyscallLaunch) run with the crate built and
#   NYRQIS_RUST_FORCE=1.
# - `rust-ipcd`: builds and tests the ADR-0021 crate (the IPC serving
#   loop — poll/recvmsg/parse/dispatch/reply in Rust, batched per
#   boundary crossing; the first NyRuntime-shaped artifact).
# - `rust-ipcd-conformance`: the serving-loop port's gate — the loader
#   and differential classes (reply semantics ≡ Python floor's status
#   service ping; forged senders dropped; batch drain) run with the
#   crate built and NYRQIS_RUST_FORCE=1.
# - `rust-keys`: builds and tests the ADR-0023 crate (the vault key
#   manager — Argon2id KEK derivation, XChaCha20-Poly1305 envelope
#   encryption, opaque KEK handles behind the FFI boundary).
# - `rust-keys-conformance`: the key manager's gate — the differential
#   class (KDF bytes and wrapped-DEK bytes identical to the PyNaCl
#   floor; cross-implementation blob interop; tamper and wrong-secret
#   rejection on both) plus the floor behavior class, run with the
#   crate built and NYRQIS_RUST_FORCE=1.
# - `rust-nyui`: builds and tests the ADR-0025 crate (the NUI
#   (.nstudio) document parse/validate import gate — the UI runtime's
#   first compiled artifact, mirroring the pure-Python reference floor
#   ui/nstudio.py).
# - `rust-nyui-conformance`: the NUI import gate's gate — the loader
#   and differential class (the floor's validation suite forced through
#   the FFI, error messages byte-identical) run with the crate built
#   and NYRQIS_RUST_FORCE=1.
# - `backend`: the pure-Python correctness floor.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-seccomp:
    name: Rust seccomp crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/seccomp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_seccomp.so

  rust-syscalls:
    name: Rust syscalls crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/syscalls
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_syscalls.so

  rust-seccomp-conformance:
    name: Rust FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/seccomp
        run: cargo build --release
      - name: Force the seccomp test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/seccomp/target/release/libnyrqis_seccomp.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestSeccompEnforcement
          test_backend.TestDefaultDenyAllowlist
          test_backend.TestRustFfILoader

  rust-syscalls-conformance:
    name: Rust syscalls FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/syscalls
        run: cargo build --release
      - name: Force the syscalls test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/syscalls/target/release/libnyrqis_syscalls.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestRustSyscallsLoader
          test_backend.TestRustSyscallsConformance

  rust-nyfs:
    name: Rust NyFS codec crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/nyfs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_nyfs.so

  rust-nyfs-conformance:
    name: Rust NyFS codec FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/nyfs
        run: cargo build --release
      - name: Force the NyFS codec test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/nyfs/target/release/libnyrqis_nyfs.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestNyFSCodecLoader
          test_backend.TestNyFSCodecConformance

  rust-ipc:
    name: Rust IPC codec crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/ipc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_ipc.so

  rust-ipc-conformance:
    name: Rust IPC codec FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/ipc
        run: cargo build --release
      - name: Force the IPC codec test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/ipc/target/release/libnyrqis_ipc.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestIPCWireLoader
          test_backend.TestIPCCodecConformance

  rust-transport:
    name: Rust IPC transport crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/transport
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_transport.so

  rust-transport-conformance:
    name: Rust IPC transport FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/transport
        run: cargo build --release
      - name: Force the transport test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/transport/target/release/libnyrqis_transport.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestTransportRustLoader
          test_backend.TestTransportConformance

  rust-ipcd:
    name: Rust IPC serving loop crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/ipcd
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_ipcd.so

  rust-ipcd-conformance:
    name: Rust IPC serving loop FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/ipcd
        run: cargo build --release
      - name: Force the serving-loop test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/ipcd/target/release/libnyrqis_ipcd.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestRustIpcdLoader
          test_backend.TestIpcdLoopConformance

  rust-container:
    name: Rust container crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/container
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_container.so

  rust-container-conformance:
    name: Rust container FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/container
        run: cargo build --release
      - name: Force the container test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/container/target/release/libnyrqis_container.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestContainerPrimitives
          test_backend.TestContainerPrimitivesLoader
          test_backend.TestContainerPrimitivesConformance
          test_backend.TestLauncherSecurity
          test_backend.TestDirectSyscallLaunch

  rust-launcher:
    name: Rust launcher-init crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: launcher binary artifact present
        run: test -x target/release/nyrqis-launcher

  rust-launcher-conformance:
    name: Rust launcher-init FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the launcher binary
        working-directory: source/nyhal-linux-backend/rust/launcher
        run: cargo build --release
      - name: Force the launcher-init classes through the compiled binary
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_LAUNCHER: rust/launcher/target/release/nyrqis-launcher
          NYRQIS_LAUNCHER_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestRustLauncherLoader
          test_backend.TestLauncherInitRust

  rust-keys:
    name: Rust keys crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/keys
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_keys.so

  rust-keys-conformance:
    name: Rust keys FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/keys
        run: cargo build --release
      - name: Install the PyNaCl floor dependency
        run: pip install pynacl
      - name: Force the keys classes through the crate
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_KEYS_LIB: rust/keys/target/release/libnyrqis_keys.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestKeysFloor
          test_backend.TestRustKeysConformance

  rust-nyui:
    name: Rust NUI crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/nyui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_nyui.so

  rust-nyui-conformance:
    name: Rust NUI FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/nyui
        run: cargo build --release
      - name: Force the NUI test classes through the crate
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/nyui/target/release/libnyrqis_nyui.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestNstudioImport
          test_backend.TestNstudioCodecConformance

  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pynacl
      - run: python3 -B test_backend.py

  generators:
    name: Code generator validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Nyrqis
      - uses: actions/checkout@v4
        with:
          repository: Myco-mycelium/Nyforge
          path: Nyforge
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow pysdl2 pysdl2-dll pynacl
      - name: Validate all generators + compositor
        run: python3 tools/validate_generators.py --verbose
        working-directory: Nyrqis

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow pysdl2 pysdl2-dll pynacl numpy watchdog pyyaml
      - name: Run benchmarks
        run: python3 tests/benchmarks_all.py --repeat 3
      - name: Run benchmarks (JSON)
        run: python3 tests/benchmarks_all.py --repeat 3 --json > /tmp/benchmarks.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: /tmp/benchmarks.json
          retention-days: 30

