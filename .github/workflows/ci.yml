        run: cargo build --release
      - name: Run the NyRuntime Python loader smoke test
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUNTIME_LIB: rust/nyruntime/target/release/libnyrqis_nyruntime.so
        run: python3 -B backend/nyruntime.py

  rust-wayland:
    name: Rust Wayland crate (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/wayland
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libwayland-dev (for runtime loading)
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_wayland.so

  rust-wayland-conformance:
    name: Rust Wayland FFI conformance (required gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/wayland
        run: cargo build --release
      # The crate dlopens the system Wayland library at runtime —
      # without libwayland-dev the load fails and the cdylib silently
      # degrades to the stub (the exact gap this gate exists to close).
      - name: Install libwayland-dev (for runtime loading)
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      # WaylandSession's software renderer is Pillow; without it
      # test_session_render_frame cannot exercise the FFI render path.
      - name: Install Pillow (the session's software renderer)
        run: pip install pillow
      - name: Force the multimonitor tests through the cdylib
        working-directory: source/nyhal-linux-backend
        env:
          # wayland_codec's candidate-path search finds target/release
          # directly; the env override documents the contract.
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          tests.test_wayland_multimonitor

  rust-compositor:
    name: Rust compositor crate (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/compositor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
