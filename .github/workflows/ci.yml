# Continuous integration: Python backend + the ADR-0020 Rust crates.
#
# - `rust-seccomp`: builds and tests the first-migration crate
#   (source/nyhal-linux-backend/rust/seccomp) on every push; the dev host
#   has no Rust toolchain, so this job IS the compiler.
# - `rust-seccomp-conformance`: the seccomp port's definition of
#   "shipped": it forces the seccomp-facing test classes through the
#   Rust seccomp module via the FFI loader (NYRQIS_RUST_FORCE=1). It
#   runs only those classes, not the full suite — forcing one module's
#   lib would make the OTHER modules' loaders (syscalls, NyFS codec)
#   fail their own force checks on the classes that depend on them. The
#   port landed 2026-08-13 and the gate is GREEN, so it is a required,
#   blocking job.
# - `rust-syscalls`: builds and tests the second-migration crate
#   (sethostname/prctl/unshare/mount — the direct-syscall launcher
#   primitives, implementation_plan.md §4.1).
# - `rust-syscalls-conformance`: the syscalls port's gate. It runs the
#   syscalls-facing test classes with NYRQIS_RUST_FORCE=1 and the crate
#   built, so every syscall call in those tests drives the Rust module.
#   (It runs only those classes, not the full suite: forcing the syscalls
#   lib would make the SEPARATE seccomp loader fail its own force check.
#   TestDirectSyscallLaunch/TestLauncherSecurity moved to the container
#   gate: they exercise the container launch-plan codec, so they must run
#   where THAT crate is built.)
# - `rust-nyfs`: builds and tests the third-migration crate
#   (SHA-256 checksum + Zstandard — the NyFS storage hot paths,
#   ADR-0020 priority #3).
# - `rust-nyfs-conformance`: the NyFS codec port's gate — the
#   differential test (Rust ≡ pure-Python floor on checksums,
#   roundtrips, and integrity failures) runs with the crate built and
#   NYRQIS_RUST_FORCE=1.
# - `rust-ipc`: builds and tests the fourth-migration crate (the IPC
#   message wire codec — binary framing, ADR-0020 priority #4).
# - `rust-ipc-conformance`: the IPC codec port's gate — the differential
#   test (Rust ≡ pure-Python floor, byte-identical wire) runs with the
#   crate built and NYRQIS_RUST_FORCE=1.
# - `rust-transport`: builds and tests the sixth-migration crate (the
#   IPC Unix-domain datagram transport hot path — sendto/recvmsg with
#   SCM_CREDENTIALS, ADR-0020 priority #6, the NPS-003 §6.1 close path).
# - `rust-transport-conformance`: the IPC transport port's gate — the
#   transport test classes (loader + differential: the FFI-driven
#   endpoint reproduces the Python floor's contract — payload, kernel
#   creds, sender path, timeout) run with the crate built and
#   NYRQIS_RUST_FORCE=1. It runs only raw-wire classes: forcing the
#   transport lib must not make the separate ipc-codec loader fail its
#   own force check.
# - `rust-container`: builds and tests the fifth-migration crate (the
#   container launch-plan primitives — launcher argv, cgroup v1/v2 plan,
#   root maps, and the NPS-010 §4 state machine, ADR-0020 priority #5).
# - `rust-container-conformance`: the container launch-plan port's gate —
#   the differential test (Rust ≡ pure-Python floor, byte-identical wires
#   across the config corpus) plus the container-facing behavior classes
#   (TestContainerPrimitives / TestLauncherSecurity /
#   TestDirectSyscallLaunch) run with the crate built and
#   NYRQIS_RUST_FORCE=1.
# - `rust-ipcd`: builds and tests the ADR-0021 crate (the IPC serving
#   loop — poll/recvmsg/parse/dispatch/reply in Rust, batched per
#   boundary crossing; the first NyRuntime-shaped artifact).
# - `rust-ipcd-conformance`: the serving-loop port's gate — the loader
#   and differential classes (reply semantics ≡ Python floor's status
#   service ping; forged senders dropped; batch drain) run with the
#   crate built and NYRQIS_RUST_FORCE=1.
# - `rust-keys`: builds and tests the ADR-0023 crate (the vault key
#   manager — Argon2id KEK derivation, XChaCha20-Poly1305 envelope
#   encryption, opaque KEK handles behind the FFI boundary).
# - `rust-keys-conformance`: the key manager's gate — the differential
#   class (KDF bytes and wrapped-DEK bytes identical to the PyNaCl
#   floor; cross-implementation blob interop; tamper and wrong-secret
#   rejection on both) plus the floor behavior class, run with the
#   crate built and NYRQIS_RUST_FORCE=1.
# - `rust-nyui`: builds and tests the ADR-0025 crate (the NUI
#   (.nstudio) document parse/validate import gate — the UI runtime's
#   first compiled artifact, mirroring the pure-Python reference floor
#   ui/nstudio.py).
# - `rust-nyui-conformance`: the NUI import gate's gate — the loader
#   and differential class (the floor's validation suite forced through
#   and NYRQIS_RUST_FORCE=1.
# - `rust-wayland`: builds and tests the ADR-0026 crate (the Wayland
#   display-server client for Nyrqis shell rendering).
# - `backend`: the pure-Python correctness floor.
# - `kernel-boot`: the nykernel's TWO boot gates as real emulated boots,
#   not just "it links": tools/qemu_boot_test.sh (GRUB/Multiboot2 BIOS,
#   kernel reaches BootPhase::Ready and exits via isa-debug-exit ->
#   status 33) and tools/qemu_uefi_boot_test.sh (the same contract on
#   the native OVMF/UEFI stub handoff), plus
#   tools/qemu_boot_parity_diff.sh, which re-runs BOTH gates and then
#   cross-checks their guest transcripts: the kernel-side demo chain
#   must be line-identical after removing only a DOCUMENTED allowlist
#   of honest boot-environment facts (stub section, memory-map counts,
#   ACPI shape, disk presence, RTC/tick nondeterminism); a residual
#   delta is a FAIL with the residual printed. The UEFI script needs OVMF
#   firmware, which the repo deliberately does NOT track (see
#   nykernel-package/.gitignore), so the job copies the distro's
#   /usr/share/OVMF/*_4M.fd files into uefi/tools/ first.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version-drift:
    name: Version drift check (pyproject == CHANGELOG)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the git-tag cross-check works
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
  py311-syntax:
    name: Shipped tree compiles under Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The live image's build gate byte-compiles the shipped tree with
      # the image's OWN interpreter (bookworm = 3.11). A 3.12-only
      # nested-quote f-string (PEP 701) once reached that gate and cost
      # three tag-build roundtrips to diagnose; this job catches the
      # class at unit-test time instead. The build gate stays
      # authoritative — it compiles with the image's interpreter.
      - run: python -m compileall -q source/nyhal-linux-backend

      - name: pyproject version must match the newest CHANGELOG release
        run: python3 tools/check_version_drift.py

  rust-seccomp:
    name: Rust seccomp crate (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/seccomp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_seccomp.so

  rust-syscalls:
    name: Rust syscalls crate (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/syscalls
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_syscalls.so

  rust-seccomp-conformance:
    name: Rust FFI conformance (required gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/seccomp
        run: cargo build --release
      - name: Force the seccomp test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/seccomp/target/release/libnyrqis_seccomp.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestSeccompEnforcement
          test_backend.TestDefaultDenyAllowlist
          test_backend.TestRustFfILoader

  rust-syscalls-conformance:
    name: Rust syscalls FFI conformance (required gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/syscalls
        run: cargo build --release
      - name: Force the syscalls test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/syscalls/target/release/libnyrqis_syscalls.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestRustSyscallsLoader
          test_backend.TestRustSyscallsConformance

  rust-nyfs:
    name: Rust NyFS codec crate (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
