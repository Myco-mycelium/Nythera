        working-directory: source/nyhal-linux-backend/rust/transport
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_transport.so

  rust-transport-conformance:
    name: Rust IPC transport FFI conformance (required gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/transport
        run: cargo build --release
      - name: Force the transport test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/transport/target/release/libnyrqis_transport.so
