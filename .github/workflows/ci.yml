      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_ipcd.so

  rust-ipcd-conformance:
    name: Rust IPC serving loop FFI conformance (required gate)
    runs-on: ubuntu-latest
