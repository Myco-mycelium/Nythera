# Continuous integration: Python backend + the ADR-0020 Rust crates.
#
# - `rust-seccomp`: builds and tests the first-migration crate
#   (source/nyhal-linux-backend/rust/seccomp) on every push; the dev host
#   has no Rust toolchain, so this job IS the compiler.
# - `rust-seccomp-conformance`: the seccomp port's definition of
#   "shipped": it forces the seccomp-facing test classes through the
#   Rust seccomp module via the FFI loader (NYRQIS_RUST_FORCE=1). It
#   runs only those classes, not the full suite — forcing one module's
#   lib would make the OTHER modules' loaders (syscalls, NyFS codec)
#   fail their own force checks on the classes that depend on them. The
#   port landed 2026-08-13 and the gate is GREEN, so it is a required,
#   blocking job.
# - `rust-syscalls`: builds and tests the second-migration crate
#   (sethostname/prctl/unshare/mount — the direct-syscall launcher
#   primitives, implementation_plan.md §4.1).
# - `rust-syscalls-conformance`: the syscalls port's gate. It runs the
#   syscalls-facing test classes with NYRQIS_RUST_FORCE=1 and the crate
#   built, so every syscall call in those tests drives the Rust module.
#   (It runs only those classes, not the full suite: forcing the syscalls
#   lib would make the SEPARATE seccomp loader fail its own force check.
#   TestDirectSyscallLaunch/TestLauncherSecurity moved to the container
#   gate: they exercise the container launch-plan codec, so they must run
#   where THAT crate is built.)
# - `rust-nyfs`: builds and tests the third-migration crate
#   (SHA-256 checksum + Zstandard — the NyFS storage hot paths,
#   ADR-0020 priority #3).
# - `rust-nyfs-conformance`: the NyFS codec port's gate — the
#   differential test (Rust ≡ pure-Python floor on checksums,
#   roundtrips, and integrity failures) runs with the crate built and
#   NYRQIS_RUST_FORCE=1.
# - `rust-ipc`: builds and tests the fourth-migration crate (the IPC
#   message wire codec — binary framing, ADR-0020 priority #4).
# - `rust-ipc-conformance`: the IPC codec port's gate — the differential
#   test (Rust ≡ pure-Python floor, byte-identical wire) runs with the
#   crate built and NYRQIS_RUST_FORCE=1.
# - `rust-container`: builds and tests the fifth-migration crate (the
#   container launch-plan primitives — launcher argv, cgroup v1/v2 plan,
#   root maps, and the NPS-010 §4 state machine, ADR-0020 priority #5).
# - `rust-container-conformance`: the container launch-plan port's gate —
#   the differential test (Rust ≡ pure-Python floor, byte-identical wires
#   across the config corpus) plus the container-facing behavior classes
#   (TestContainerPrimitives / TestLauncherSecurity /
#   TestDirectSyscallLaunch) run with the crate built and
#   NYRQIS_RUST_FORCE=1.
# - `backend`: the pure-Python correctness floor.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-seccomp:
    name: Rust seccomp crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/seccomp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_seccomp.so

  rust-syscalls:
    name: Rust syscalls crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/syscalls
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_syscalls.so

  rust-seccomp-conformance:
    name: Rust FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/seccomp
        run: cargo build --release
      - name: Force the seccomp test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/seccomp/target/release/libnyrqis_seccomp.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestSeccompEnforcement
          test_backend.TestDefaultDenyAllowlist
          test_backend.TestRustFfILoader

  rust-syscalls-conformance:
    name: Rust syscalls FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/syscalls
        run: cargo build --release
      - name: Force the syscalls test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/syscalls/target/release/libnyrqis_syscalls.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestRustSyscallsLoader
          test_backend.TestRustSyscallsConformance

  rust-nyfs:
    name: Rust NyFS codec crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/nyfs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_nyfs.so

  rust-nyfs-conformance:
    name: Rust NyFS codec FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/nyfs
        run: cargo build --release
      - name: Force the NyFS codec test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/nyfs/target/release/libnyrqis_nyfs.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestNyFSCodecLoader
          test_backend.TestNyFSCodecConformance

  rust-ipc:
    name: Rust IPC codec crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/ipc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_ipc.so

  rust-ipc-conformance:
    name: Rust IPC codec FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/ipc
        run: cargo build --release
      - name: Force the IPC codec test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/ipc/target/release/libnyrqis_ipc.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestIPCWireLoader
          test_backend.TestIPCCodecConformance

  rust-container:
    name: Rust container crate (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/container
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_container.so

  rust-container-conformance:
    name: Rust container FFI conformance (required gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/container
        run: cargo build --release
      - name: Force the container test classes through the FFI
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/container/target/release/libnyrqis_container.so
          NYRQIS_RUST_FORCE: "1"
        run: >
          python3 -B -m unittest
          test_backend.TestContainerPrimitives
          test_backend.TestContainerPrimitivesLoader
          test_backend.TestContainerPrimitivesConformance
          test_backend.TestLauncherSecurity
          test_backend.TestDirectSyscallLaunch

  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/nyhal-linux-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -B test_backend.py
