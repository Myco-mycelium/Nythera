        run: >
          python3 -B -m unittest
          test_backend.TestRustIpcdLoader
          test_backend.TestIpcdLoopConformance

  rust-container:
    name: Rust container crate (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/container
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - name: cdylib artifact present
        run: test -s target/release/libnyrqis_container.so

  rust-container-conformance:
    name: Rust container FFI conformance (required gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate
        working-directory: source/nyhal-linux-backend/rust/container
        run: cargo build --release
      - name: Run the container test classes with the Rust crate
        working-directory: source/nyhal-linux-backend
        env:
          NYRQIS_RUST_LIB: rust/container/target/release/libnyrqis_container.so
        run: >
          python3 -B -m unittest
          test_backend.TestContainerPrimitives
          test_backend.TestContainerPrimitivesLoader
          test_backend.TestContainerPrimitivesConformance
          test_backend.TestLauncherSecurity
          test_backend.TestDirectSyscallLaunch

  rust-launcher:
    name: Rust launcher-init crate (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/nyhal-linux-backend/rust/launcher
    steps:
