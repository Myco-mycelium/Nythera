name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/**"
      - "scripts/**"
      - "source/nyhal-linux-backend/shell/**"
      - "source/nyhal-linux-backend/nst_validate.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/**"
      - "scripts/**"
      - "source/nyhal-linux-backend/shell/**"
      - "source/nyhal-linux-backend/nst_validate.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install -r requirements-docs.txt

      - name: Check depends_on cycles
        run: python3 tools/check_depends_on_cycles.py

      - name: Check recorded doc premises
        run: python3 tools/check_doc_premises.py

      - name: Check .nstudio design documents (NFS-001 import gate)
        run: bash scripts/check_nstudio_designs.sh

      - name: Build site
        run: mkdocs build --strict

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
