[package]
name = "nyrqis-wayland"
version = "0.1.0"
edition = "2021"
description = "Nyrqis Wayland display-server client — surface management, input handling, and buffer allocation (ADR-0026)"

[lib]
name = "nyrqis_wayland"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
# Raw FFI bindings to libwayland-client.  We use the raw C API directly
# rather than the high-level wayland-client crate because our FFI surface
# needs to be synchronous and C-compatible — the high-level crate's
# event-dispatch model doesn't map cleanly to a cdylib boundary.
# The wayland-client crate (0.31) is too tightly coupled to Rust's
# async/event-loop model for our needs.
wayland-sys = { version = "0.31", features = ["client", "dlopen"] }

[dev-dependencies]
