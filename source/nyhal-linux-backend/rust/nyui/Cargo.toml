[package]
name = "nyrqis-nyui"
version = "0.1.0"
edition = "2021"
description = "Nyrqis NUI (.nstudio) document parse/validate — the UI runtime's import gate, ADR-0025"

[lib]
name = "nyrqis_nyui"
# cdylib is the FFI artifact a Python ctypes loader dlopens; rlib is
# included so `cargo test` can link the crate's unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# JSON parsing for .nstudio documents, plus serde derive for typed
# access to the embedded Nyrqis API Registry (ui/contracts/nui-api-v1.json
# — the single machine-readable source of truth for the NUI component
# vocabulary, NFS-006 / ADR-0025). The pure-Python reference floor
# (ui/nstudio.py) reads the same registry file; the conformance gate
# forces the floor's suite through this FFI unchanged.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
