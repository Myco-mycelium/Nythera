[package]
name = "nyrqis-nycore"
version = "0.1.0"
edition = "2021"
description = "Nyrqis core types, error definitions, and IPC protocol — the foundation for NyRuntime and all Nyrqis services"

[lib]
name = "nyrqis_nycore"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
