[package]
name = "nyrqis-syscalls"
version = "0.1.0"
edition = "2021"
description = "Nyrqis direct syscall wrappers (sethostname/prctl/unshare) — ADR-0020 migration priority #2"

[lib]
name = "nyrqis_syscalls"
# cdylib is the FFI artifact a Python ctypes loader dlopens; rlib is
# included so `cargo test` can link the crate's unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Thin libc wrappers: every entry point calls one libc function and
# returns 0 or -errno (the Linux syscall convention), so the Python side
# maps -errno to OSError exactly as the ctypes path does today.
libc = "0.2"
